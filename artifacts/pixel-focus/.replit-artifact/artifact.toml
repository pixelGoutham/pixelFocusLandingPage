kind = "web"
previewPath = "/"
title = "Pixel Focus"
version = "1.0.0"
id = "artifacts/pixel-focus"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 19933

[services.development]
run = "pnpm --filter @workspace/pixel-focus run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/pixel-focus", "run", "build" ]
serve = "static"
publicDir = "artifacts/pixel-focus/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "19933"
BASE_PATH = "/"
